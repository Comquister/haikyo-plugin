[package]
name = "haikyo-pumpkin-wasm"
version = "0.1.0"
edition = "2024"
authors = ["Comquister <contato@conquister.net>"]
description = "Haikyo Client official universal WebAssembly plugin for PumpkinMC (Minecraft 26.3)"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { path = "../../work/pumpkin-repo/crates/pumpkin-plugin-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }
hex = "0.4"
base64 = "0.22"
uuid = { version = "1.15", default-features = false, features = ["v4", "serde"] }

[package.metadata.component]
package = "haikyo:haikyo-plugin"
