name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-java:
    name: Build Java Plugins & Mods
    runs-on: [self-hosted, haikyo-linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run tests
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./gradlew clean build -PhaikyoVersion="$TAG_VER" --stacktrace
          else
            ./gradlew clean build --stacktrace
          fi

      - name: Stage Java JARs (flat directory for GitHub Release)
        shell: bash
        run: |
          mkdir -p dist
          for mod in haikyo-paper haikyo-velocity haikyo-fabric haikyo-api; do
            for jar in "$mod"/build/libs/"$mod"-*.jar; do
              case "$jar" in
                *-sources.jar) continue ;;
                *) cp "$jar" dist/ ;;
              esac
            done
          done
          ls -la dist

      - name: Upload Java JARs
        uses: actions/upload-artifact@v7
        with:
          name: java-jars
          path: dist/*.jar

  build-pumpkin-native:
    name: Build Pumpkin Native (${{ matrix.label }})
    runs-on: ${{ startsWith(matrix.runner, '[') && fromJSON(matrix.runner) || matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            runner: '["self-hosted","haikyo-linux"]'
            artifact: libhaikyo_pumpkin.so
            output_name: haikyo-pumpkin-linux.so
            self_hosted: true
          - label: windows
            runner: windows-latest
            artifact: haikyo_pumpkin.dll
            output_name: haikyo-pumpkin-windows.dll
            self_hosted: false
          - label: macos
            runner: macos-latest
            artifact: libhaikyo_pumpkin.dylib
            output_name: haikyo-pumpkin-macos.dylib
            self_hosted: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sync PumpkinMC Upstream
        run: |
          PUMPKIN_DIR="${{ github.workspace }}/../work/pumpkin-repo"
          mkdir -p "$(dirname "$PUMPKIN_DIR")"
          if [ -d "$PUMPKIN_DIR/.git" ]; then
            git -C "$PUMPKIN_DIR" fetch --depth 1 origin HEAD
            git -C "$PUMPKIN_DIR" reset --hard FETCH_HEAD
            git -C "$PUMPKIN_DIR" clean -fd
          else
            rm -rf "$PUMPKIN_DIR"
            git clone --depth 1 https://github.com/Pumpkin-MC/Pumpkin.git "$PUMPKIN_DIR"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure persistent Cargo cache on self-hosted runner
        if: matrix.self_hosted
        run: |
          mkdir -p "$HOME/haikyo-plugin-build/pumpkin-native"
          echo "CARGO_TARGET_DIR=$HOME/haikyo-plugin-build/pumpkin-native" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"

      - name: Test haikyo-pumpkin
        run: cargo test
        working-directory: haikyo-pumpkin

      - name: Build Release haikyo-pumpkin
        run: cargo build --release
        working-directory: haikyo-pumpkin

      - name: Stage artifact
        run: |
          TARGET_DIR="${CARGO_TARGET_DIR:-haikyo-pumpkin/target}"
          mkdir -p dist
          cp "$TARGET_DIR/release/${{ matrix.artifact }}" "dist/${{ matrix.output_name }}"

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pumpkin-native-${{ matrix.label }}
          path: dist/${{ matrix.output_name }}

  build-pumpkin-wasm:
    name: Build Pumpkin Wasm Component
    runs-on: [self-hosted, haikyo-linux]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sync PumpkinMC Upstream
        run: |
          PUMPKIN_DIR="${{ github.workspace }}/../work/pumpkin-repo"
          mkdir -p "$(dirname "$PUMPKIN_DIR")"
          if [ -d "$PUMPKIN_DIR/.git" ]; then
            git -C "$PUMPKIN_DIR" fetch --depth 1 origin HEAD
            git -C "$PUMPKIN_DIR" reset --hard FETCH_HEAD
            git -C "$PUMPKIN_DIR" clean -fd
          else
            rm -rf "$PUMPKIN_DIR"
            git clone --depth 1 https://github.com/Pumpkin-MC/Pumpkin.git "$PUMPKIN_DIR"
          fi

      - name: Install Rust toolchain & wasm32-wasip2 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Configure persistent Cargo cache on self-hosted runner
        run: |
          mkdir -p "$HOME/haikyo-plugin-build/pumpkin-wasm"
          echo "CARGO_TARGET_DIR=$HOME/haikyo-plugin-build/pumpkin-wasm" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"

      - name: Build Wasm Component (wasm32-wasip2)
        run: cargo build --target wasm32-wasip2 --release
        working-directory: haikyo-pumpkin-wasm

      - name: Stage Wasm artifact
        run: |
          TARGET_DIR="${CARGO_TARGET_DIR:-haikyo-pumpkin-wasm/target}"
          mkdir -p dist
          cp "$TARGET_DIR/wasm32-wasip2/release/haikyo_pumpkin_wasm.wasm" dist/haikyo-pumpkin.wasm

      - name: Upload Wasm Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pumpkin-wasm
          path: dist/haikyo-pumpkin.wasm

  publish-release:
    name: Publish GitHub Release
    needs: [build-java, build-pumpkin-native, build-pumpkin-wasm]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, haikyo-linux]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify and list Release Files + SHA256SUMS
        shell: bash
        run: |
          ls -la release-assets
          for req in haikyo-paper haikyo-velocity haikyo-fabric haikyo-api; do
            ls release-assets/"${req}"-*.jar >/dev/null
          done
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
