name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: ./gradlew build --stacktrace

      - name: Upload plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: haikyo-plugin-jars
          path: |
            haikyo-paper/build/libs/haikyo-paper-*.jar
            haikyo-velocity/build/libs/haikyo-velocity-*.jar
            haikyo-fabric/build/libs/haikyo-fabric-*.jar
            haikyo-api/build/libs/haikyo-api-*.jar
            !**/build/libs/*-sources.jar
