name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-java:
    name: Build Java Plugins & Mods
    runs-on: [self-hosted, haikyo-linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run tests
        run: ./gradlew build --stacktrace

      - name: Stage Java JARs
        shell: bash
        run: |
          mkdir -p dist
          for mod in haikyo-paper haikyo-velocity haikyo-fabric haikyo-api; do
            for jar in "$mod"/build/libs/"$mod"-*.jar; do
              case "$jar" in
                *-sources.jar) continue ;;
                *) cp "$jar" dist/ ;;
              esac
            done
          done

      - name: Upload plugin JARs
        uses: actions/upload-artifact@v7
        with:
          name: haikyo-plugin-jars
          path: dist/*.jar

  build-pumpkin-wasm:
    name: Build Pumpkin Wasm Component
    runs-on: [self-hosted, haikyo-linux]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sync PumpkinMC Upstream
        run: |
          PUMPKIN_DIR="${{ github.workspace }}/../work/pumpkin-repo"
          mkdir -p "$(dirname "$PUMPKIN_DIR")"
          if [ -d "$PUMPKIN_DIR/.git" ]; then
            git -C "$PUMPKIN_DIR" fetch --depth 1 origin HEAD
            git -C "$PUMPKIN_DIR" reset --hard FETCH_HEAD
            git -C "$PUMPKIN_DIR" clean -fd
          else
            rm -rf "$PUMPKIN_DIR"
            git clone --depth 1 https://github.com/Pumpkin-MC/Pumpkin.git "$PUMPKIN_DIR"
          fi

      - name: Install Rust toolchain & wasm32-wasip2 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Configure persistent Cargo cache on self-hosted runner
        run: |
          mkdir -p "$HOME/haikyo-plugin-build/pumpkin-wasm"
          echo "CARGO_TARGET_DIR=$HOME/haikyo-plugin-build/pumpkin-wasm" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"

      - name: Build Wasm Component (wasm32-wasip2)
        run: cargo build --target wasm32-wasip2 --release
        working-directory: haikyo-pumpkin-wasm

      - name: Stage Wasm artifact
        run: |
          TARGET_DIR="${CARGO_TARGET_DIR:-haikyo-pumpkin-wasm/target}"
          mkdir -p dist
          cp "$TARGET_DIR/wasm32-wasip2/release/haikyo_pumpkin_wasm.wasm" dist/haikyo-pumpkin.wasm

      - name: Upload Wasm Artifact
        uses: actions/upload-artifact@v7
        with:
          name: haikyo-pumpkin-wasm
          path: dist/haikyo-pumpkin.wasm
