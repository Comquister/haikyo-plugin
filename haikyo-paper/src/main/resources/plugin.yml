name: Haikyo
version: '${version}'
main: dev.haikyo.paper.HaikyoPaperPlugin
api-version: '1.13'
folia-supported: true
description: Server-side integration for the Haikyo Minecraft Client (attestation, mod rules, integrated anticheat, admin tools, voice chat)
authors:
  - Haikyo Project Contributors
website: https://haikyo.conquister.net
softdepend:
  - GrimAC
  - Vulcan
  - voicechat
  - LuckPerms

commands:
  haikyo:
    description: Manage Haikyo client integration, player trust status, admin tools, voice moderation, and pardons.
    usage: /haikyo <status [player] | info <player> | hwid <player> | screenshot <player> | voice <mute|unmute|forcemute> <player> | pardon <player> | suspect <player> [reason] | reload>
    permission: haikyo.command.status

permissions:
  haikyo.admin:
    description: Grants access to all Haikyo administrative commands.
    default: op
    children:
      haikyo.command.status: true
      haikyo.command.pardon: true
      haikyo.command.suspect: true
      haikyo.command.reload: true
      haikyo.admin.info: true
      haikyo.admin.screenshot: true
      haikyo.admin.voice: true
  haikyo.command.status:
    description: View Haikyo client and attestation status of online players.
    default: op
  haikyo.command.pardon:
    description: Remove a player from requires-haikyo.json.
    default: op
  haikyo.command.suspect:
    description: Mark a player as SUSPECT and optionally require attested Haikyo.
    default: op
  haikyo.command.reload:
    description: Reload Haikyo configuration and mod rules.
    default: op
  haikyo.admin.info:
    description: Inspect client environment info and salted per-server HWID (/haikyo info, /haikyo hwid).
    default: op
  haikyo.admin.screenshot:
    description: Request an in-game screenshot with mandatory player HUD notification (/haikyo screenshot).
    default: op
  haikyo.admin.voice:
    description: Moderate Simple Voice Chat players via Haikyo (/haikyo voice).
    default: op
